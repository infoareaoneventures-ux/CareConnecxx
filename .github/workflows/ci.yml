name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci && npm --prefix functions ci

      - name: Agent-Native runtime guard
        run: node scripts/guard-no-agent-native-runtime.mjs

      - name: Run unit tests
        run: npm test -- --run
        env:
          # Vitest needs a value for any required env vars; tests should mock Firebase.
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci.example.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci.example.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: ci-placeholder
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder

      - name: Build frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci.example.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci.example.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: ci-placeholder
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
          VITE_SUPPORT_PHONE: '+15555550101'
          VITE_LINQ_PHONE_NUMBER: '+15555550102'

      - name: Build Cloud Functions
        run: npm --prefix functions run build
