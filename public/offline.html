<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Offline | Evia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #f0fdfa;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: #64748b; font-size: 1rem; max-width: 400px; line-height: 1.6; margin-bottom: 2rem; }
    .btn {
      display: inline-block;
      background: #0d9488;
      color: white;
      font-weight: 600;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
    }
    .btn:hover { background: #0f766e; }
  </style>
</head>
<body>
  <div class="icon">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 6s2.5-3 11-3 11 3 11 3"/>
      <path d="M1 10s2.5-2 11-2 11 2 11 2"/>
      <line x1="2" y1="20" x2="22" y2="4"/>
    </svg>
  </div>
  <h1>You're offline</h1>
  <p>It looks like you've lost your internet connection. Please check your connection and try again.</p>
  <button class="btn" onclick="window.location.reload()">Try Again</button>
</body>
</html>
